# Khayalami web portal — https://khayamanage.co.zw
#
# Proxies:
#   /api/backend/*  →  Node backend (REST)
#   /socket.io/*    →  Node backend (Socket.IO / WebSocket)
#   /*              →  static portal build (Vue)
#
# Install on the PORTAL server (where khayamanage.co.zw is hosted):
#   sudo cp deploy/nginx-khayamanage-portal.conf /etc/nginx/sites-available/khayamanage
#   sudo ln -sf /etc/nginx/sites-available/khayamanage /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Portal build env (set before npm run build):
#   VITE_API_URL=https://khayamanage.co.zw/api/backend
#   VITE_SOCKET_URL=https://khayamanage.co.zw
#
# Verify:
#   curl https://khayamanage.co.zw/api/backend/health
#   curl "https://khayamanage.co.zw/socket.io/?EIO=4&transport=polling"
#   (socket should return JSON handshake, not 404)

upstream khaya_node_backend {
    server 31.220.82.129:4002;
    keepalive 32;
}

server {
    listen 80;
    server_name khayamanage.co.zw www.khayamanage.co.zw;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name khayamanage.co.zw www.khayamanage.co.zw;

    # TLS — adjust paths to your certbot / certificate files
    ssl_certificate     /etc/letsencrypt/live/khayamanage.co.zw/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/khayamanage.co.zw/privkey.pem;

    client_max_body_size 10m;

    # --- REST API (portal uses VITE_API_URL=.../api/backend) ---
    location /api/backend/ {
        proxy_pass http://khaya_node_backend/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # --- Socket.IO (portal uses VITE_SOCKET_URL=https://khayamanage.co.zw) ---
    location /socket.io/ {
        proxy_pass http://khaya_node_backend/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    # --- Static portal (Vue dist) ---
    root /var/www/khayamanage-portal;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
