# Khayalami backend — Node on port 4002 with Socket.IO WebSocket support
# Install: sudo cp deploy/nginx-khaya-4002.conf /etc/nginx/sites-available/khaya-4002
#          sudo ln -sf /etc/nginx/sites-available/khaya-4002 /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx

upstream khaya_backend {
    server 127.0.0.1:4002;
    keepalive 64;
}

server {
    listen 4002;
    server_name 31.220.82.129;

    client_max_body_size 10m;

    location /socket.io/ {
        proxy_pass http://khaya_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    location / {
        proxy_pass http://khaya_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 86400;
    }
}

